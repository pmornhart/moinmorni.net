packages:
  - apps/*
  - packages/*
  - tools/*
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
overrides:
  # drizzle-kit (nur Entwicklung) zieht über @esbuild-kit noch esbuild 0.18 mit bekannter Lücke (GHSA-67mh-4wv8-2f99).
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
# Lieferketten-Schutz wie bei MorniHosting: neue Paketversionen erst nach 7 Tagen (10080 Minuten), keine Unterpakete aus
# Git- oder Tarball-Quellen, kein Update, das schwächer abgesichert veröffentlicht wurde als sein Vorgänger.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
