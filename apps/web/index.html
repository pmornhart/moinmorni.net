<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a20" />
    <meta
      name="description"
      content="morni.net – dein Minecraft-Netzwerk mit Alpendorf, Schloss und vielen Spielmodi. Für Java und Bedrock."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>morni.net – Minecraft-Netzwerk</title>
    <script>
      // Hell oder dunkel schon vor dem ersten Bild setzen, damit nichts aufblitzt.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('mm-theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
