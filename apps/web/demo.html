    <title>MoinMorni – Demo der Webseite</title>
    <script>
      // Hell oder dunkel schon vor dem ersten Bild setzen, damit nichts aufblitzt.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('mm-theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
