# MorniSMP – Einstellungen
# Geldbeträge in Talern (Komma als Punkt schreiben: 2.5 = 2,50 Taler). Nach Änderungen: /smpadmin neuladen
# (Weltgrenzen und Preise gelten sofort, die Datenbank bleibt).

waehrung:
  # Zeichen hinter jedem Betrag
  zeichen: "₮"
  # So viel bekommt jeder beim allerersten Betreten
  startguthaben: 100
  # Ab diesem Betrag fragt /zahlen noch einmal nach („Wirklich?“)
  zahlen-bestaetigen-ab: 1000

welt:
  # Hauptwelt (Oberwelt); Nether und End sind die normalen Dimensionen dazu
  name: world
  # Weltgrenze als Radius um 0/0 (Blöcke)
  grenze-radius: 10000
  grenze-radius-nether: 1250
  grenze-radius-end: 10000
  # Wie lange man nach einem Treffer „im Kampf“ ist (0 = aus)
  kampf-sekunden: 15
  # Zeitzone für Tageszähler (Belohnung, Ankauf)
  zeitzone: Europe/Berlin

# Die Marktstadt steht in einer eigenen, leeren Welt (eine Art vierte Dimension): immer Tag, kein Wetter, keine
# Monster, ganz geschützt. Neue Spieler, /spawn und wer ohne Bett stirbt, landen dort. Drei Reisetore führen per
# Zufalls-Teleport in Oberwelt, Nether und End.
spawnwelt:
  name: smp_spawn
  # Höhe der Stadt-Insel (Bodenschicht)
  hoehe: 90

reisetore:
  # Welcher Ring beim Tor zur Oberwelt: nah, mittel oder weit
  oberwelt: nah

teleport:
  # Wartezeit vor jedem Teleport (stillhalten!)
  wartezeit-sekunden: 3
  # Admins (OP / morni.smp.admin) ohne Wartezeit
  admins-sofort: true
  # Höchstzahl Zuhause pro Spieler
  zuhause-max: 3

zufallsteleport:
  # Abklingzeit nach einem Zufalls-Teleport
  abklingzeit-sekunden: 60
  # Ringe (kleinster und größter Abstand zu 0/0)
  nah: [500, 2000]
  mittel: [2000, 5000]
  weit: [5000, 9500]
  # Nether: sicherer Platz zwischen y 32 und 110 (nie auf Lava, nie aufs Dach)
  nether: [100, 1100]
  # End: auf den äußeren Inseln, sonst auf der Hauptinsel – nie in die Leere
  end: [1000, 5000]

auktionshaus:
  # Gebühr beim Verkauf (vom Erlös, geht an die Stadt)
  gebuehr-prozent: 2.0
  # Wie lange ein Angebot steht; danach liegt es im Abholfach
  dauer-stunden: 48
  # Höchstzahl gleichzeitiger Angebote pro Spieler
  max-angebote: 10

auftraege:
  # Gebühr beim Beliefern (vom Lohn des Lieferanten)
  gebuehr-prozent: 2.0
  dauer-tage: 7
  max-auftraege: 5

laeden:
  # Gebühr bei Ladenkisten (0 = keine)
  gebuehr-prozent: 0.0

marktstaende:
  miete-pro-woche: 300
  # Hinweis an den Mieter so lange vor dem Ablauf
  warnen-stunden-vorher: 24
  # So viele Wochen darf man im Voraus zahlen
  max-wochen-im-voraus: 4

# In Oberwelt, Nether und End (nicht in der Spawn-Welt)
grundstuecke:
  # So viele Chunks sind gratis
  gratis: 4
  # Preis für jeden weiteren Chunk
  preis: 250
  max: 64

# Händlerhaus (Server-Shop, /shop): Der Händler der Stadt verkauft zu festen Preisen und kauft an – das ist auch
# der Ankauf (/verkaufen, Sachen hineinlegen). Damit der freie Markt (Auktionshaus, Aufträge, Ladenkisten) lebt,
# verkauft der Händler teuer und kauft billig: Ankaufspreise liegen höchstens bei „verkauf-max-prozent“ des
# Kaufpreises. Gepresste Blöcke (Eisenblock, Heuballen …) kauft er nicht an, damit niemand die Tagesmengen umgeht.
haendler:
  # Händlerhaus und /shop an? (aus: auch kein Ankauf)
  an: true
  # Ankaufspreis höchstens so viel Prozent vom Kaufpreis (Waren über der Grenze werden beim Laden gesenkt)
  verkauf-max-prozent: 40
  # Ab diesem Betrag fragt der Händler noch einmal nach („Wirklich?“)
  bestaetigen-ab: 250
  # Fassung der Preisliste (nicht ändern): Steht auf einem Server noch die unveränderte Liste einer älteren Fassung,
  # bekommt er beim Start die neue; eine selbst geänderte Liste bleibt
  preisliste: 3
  # Abteilungen: Kennung → Symbol (Minecraft-Sorte) und Name auf Deutsch/Englisch. Reihenfolge = Reihenfolge im Menü.
  abteilungen:
    bloecke: {symbol: bricks, de: "Baublöcke", en: "Building blocks"}
    holz: {symbol: oak_sapling, de: "Holz & Pflanzen", en: "Wood & plants"}
    erze: {symbol: diamond, de: "Erze & Edelsteine", en: "Ores & gems"}
    deko: {symbol: magenta_dye, de: "Farben & Deko", en: "Colours & decor"}
    essen: {symbol: bread, de: "Essen & Ernte", en: "Food & crops"}
    werkzeug: {symbol: iron_pickaxe, de: "Werkzeug & Waffen", en: "Tools & weapons"}
    traenke: {symbol: brewing_stand, de: "Tränke & Zauber", en: "Potions & magic"}
    redstone: {symbol: redstone, de: "Redstone & Technik", en: "Redstone & tech"}
    beute: {symbol: bone, de: "Mob-Beute", en: "Mob drops"}
    besonderes: {symbol: firework_rocket, de: "Besonderes & Saison", en: "Special & seasonal"}

  # Preis-Faktor je Abteilung: alle Kauf- und Ankaufspreise der Abteilung mal diesem Wert (1 = wie in der Liste unten,
  # 2 = doppelt so teuer, 0.5 = halb so teuer; 0.05 bis 100). Der Schleifen-Wächter senkt danach jeden Ankaufspreis, der
  # sonst eine Geld-Schleife über Werkbank, Ofen oder Abbauen öffnen würde (steht dann als Hinweis im Server-Log).
  faktoren:
    bloecke: 1
    holz: 1
    erze: 1
    deko: 1
    essen: 1
    werkzeug: 1
    traenke: 1
    redstone: 1
    beute: 1
    besonderes: 1

  # Waren je Abteilung (Reihenfolge = Reihenfolge im Menü). Preise in Talern pro Stück:
  #   kauf      – so viel zahlen Spieler (weglassen = nicht zu kaufen)
  #   verkauf   – so viel zahlt der Händler (weglassen = kauft er nicht an)
  #   tag       – so viele Stück nimmt er pro Spieler und Tag zum vollen Preis an (Vorgabe 256), danach „ankauf.stufen“
  #   kauf-tag  – so viele Stück darf jeder pro Tag kaufen (weglassen = ohne Grenze)
  #   monate    – nur in diesen Monaten im Angebot (Saison-Ware), z. B. [10, 11]
