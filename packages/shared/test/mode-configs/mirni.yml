# Börse: Jede Ware des Händlerhauses hat einen Kurs nach Angebot und Nachfrage. Verkaufen alle zusammen viel an Vroni,
# sinkt der Kurs und sie zahlt weniger; kaufen alle viel, steigt er und sie verlangt mehr. Mit der Zeit kehrt jeder Kurs
# zum Grundpreis (Preise oben) zurück. Vroni zahlt nie mehr als den Grundpreis und verlangt nie weniger – darum bringt
# „billig kaufen, warten, teuer verkaufen“ bei ihr nie Gewinn. Spielerpreise (Auktionshaus, Aufträge, Läden) bleiben frei.
boerse:
  # Kurse an? (aus: immer der Grundpreis)
  an: true
  # So viele Tagesmengen („tag“ der Ware) muss die Stadt mehr an Vroni verkaufen als bei ihr kaufen, bis sie nur noch
  # die Hälfte zahlt – und genauso viele mehr kaufen als verkaufen, bis sie das Doppelte verlangt
  halbieren-nach: 4
  # Nach so vielen Stunden ist die Hälfte eines Ausschlags wieder weg (der Kurs erholt sich)
  erholung-stunden: 6
  # Grenzen in Prozent vom Grundpreis: der Ankauf fällt höchstens bis „min“, der Verkauf steigt höchstens bis „max“
  min-prozent: 25
  max-prozent: 300

# Stufen des Ankaufs (gilt für alles, was der Händler ankauft): Wer mehr als die Tagesmenge („tag“ der Ware) bringt,
# bekommt weniger – ab dem Vielfachen der Tagesmenge so viel Prozent.
ankauf:
  stufen:
    - {ab: 0, prozent: 100}
    - {ab: 1, prozent: 50}
    - {ab: 2, prozent: 20}
    - {ab: 4, prozent: 5}

belohnung:
  # So lange muss man heute schon gespielt haben
  mindest-minuten: 15
  taler: 25
  # Pro Tag in Folge mehr (bis max-serie)
  plus-pro-serientag: 5
  max-serie: 7
  # Gegenstände dazu („name:anzahl“)
  gegenstaende:
    - "bread:8"
    - "torch:16"
  # ab dem 7. Tag in Folge stattdessen
  gegenstaende-ab-serie-7:
    - "bread:16"
    - "torch:32"
    - "experience_bottle:4"

kopfgeld:
  # Mindestbetrag für ein Kopfgeld
