# Morni Wintersport – Einstellungen. Nach Änderungen: /wsadmin neuladen (oder Server neu starten).

# Eigene leere Welt für das Bergdorf und alle Strecken (wird beim ersten Start angelegt und gebaut).
welt: wintersport

# Saison: „immer“ = das ganze Jahr offen, „winter“ = nur vom 1. Dezember bis 31. März.
# Außerhalb der Saison bleibt das Dorf zum Anschauen offen, Wettkämpfe gibt es keine; das Netzwerk sieht „geschlossen“.
saison: immer

# Licht: „tag“ (Mittag, hell) oder „abend“ (Sonnenuntergang, die Laternen leuchten).
tageszeit: tag

# Leise rieselnder Schnee um jeden Spieler (nur Anzeige).
schneefall: true

dorf:
  # So lange läuft der Countdown im Dorf, bevor ein Wettkampf startet. Sagen alle „bereit“, geht es nach 5 Sekunden los.
  countdown-sekunden: 30
  # Ab so vielen Leuten im Dorf beginnt der Countdown von selbst (sonst, sobald jemand „bereit“ ist).
  mindestens-spieler: 2

wettkampf:
  # Höchstens so viele Leute in einem Wettkampf (1–12). Partys bleiben zusammen.
  hoechstens-spieler: 12
  # Pause zwischen zwei Disziplinen (Zwischenstand).
  pause-sekunden: 8
  # So lange dauert die Siegerehrung am Treppchen, danach geht es zurück ins Dorf.
  siegerehrung-sekunden: 12

slalom:
  # Zeitstrafe für jedes verpasste Tor.
  strafe-sekunden: 3
  # Wer bis dahin nicht im Ziel ist, scheidet in diesem Lauf aus.
  zeitlimit-sekunden: 90

bob:
  # Partys fahren zu zweit in einem Bob (der Erste lenkt). Aus: jeder fährt allein.
  zweierbob: true
  zeitlimit-sekunden: 90

biathlon:
  # Runden auf der Loipe und wie oft dazwischen geschossen wird (nach Runde 1, 2 …).
  runden: 3
  schiessen: 2
  zeitlimit-sekunden: 360
  # So lange hat man am Schießstand für die fünf Schuss.
  schiess-zeit-sekunden: 40
  # Schnelligkeit beim Laufen (0 = normal, 2 = wie Schnelligkeit II).
  tempo: 2
